<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Why I Write These Myself">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fade)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- top label -->
  <text x="80" y="120" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#737373" letter-spacing="2">// first post</text>

  <!-- title -->
  <text x="78" y="300" font-family="'Inter', system-ui, sans-serif" font-size="92" font-weight="700" fill="#fafafa">Why I Write</text>
  <text x="78" y="408" font-family="'Inter', system-ui, sans-serif" font-size="92" font-weight="700" fill="#fafafa">These Myself<tspan fill="#fafafa">&#160;</tspan><tspan fill="#22d3ee">|</tspan></text>

  <!-- accent underline -->
  <rect x="82" y="446" width="120" height="6" rx="3" fill="#22d3ee"/>

  <!-- footer -->
  <text x="80" y="560" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="26" fill="#a3a3a3">jamilwhitehead.dev</text>
  <text x="1120" y="560" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" fill="#525252">written by hand, not AI</text>
</svg>
